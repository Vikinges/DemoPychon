[project]
name = "telemetry-bridge-demo"
version = "0.1.0"
description = "Async sim-telemetry bridge: real-time WebSocket stream + full-rate Parquet logging."
requires-python = ">=3.10"
dependencies = ["websockets>=12", "pyarrow>=14"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
